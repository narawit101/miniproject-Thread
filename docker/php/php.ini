; ─── PHP Custom Settings ───────────────────────────────────────

; ขนาด Upload (รองรับรูปภาพใน posts/comments)
upload_max_filesize = 20M
post_max_size = 25M

; Memory & Timeout
memory_limit = 256M
max_execution_time = 300

; แสดง Error ในระหว่าง Development
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Timezone
date.timezone = Asia/Bangkok
