services:

  # ─── Nginx Web Server ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dpi_nginx
    ports:
      - "8080:80"        # เข้าถึง app ที่ http://localhost:8080
    volumes:
      - ./:/var/www/html                          # mount โค้ดทั้งหมด
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - dpi_network

  # ─── PHP-FPM ────────────────────────────────────────────────
  php:
    build:
      context: ./docker/php
    container_name: dpi_php
    volumes:
      - ./:/var/www/html                          # mount โค้ดทั้งหมด
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dpi_network

  # ─── MySQL Database ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: dpi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"      # ใช้ 3307 เผื่อชนกับ MySQL ในเครื่อง
    volumes:
      - dpi_mysql_data:/var/lib/mysql             # เก็บข้อมูลถาวร
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql  # import DB อัตโนมัติ
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dpi_network

  # ─── phpMyAdmin ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dpi_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"        # เข้าถึง phpMyAdmin ที่ http://localhost:8081
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - dpi_network

# ─── Volumes ────────────────────────────────────────────────
volumes:
  dpi_mysql_data:

# ─── Networks ───────────────────────────────────────────────
networks:
  dpi_network:
    driver: bridge
